
name: Build TheDonax APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Compilar APK
        run: |
          cd TheDonax-Android-project
          chmod +x gradlew 2>/dev/null || true
          gradle assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: TheDonax-APK
          path: TheDonax-Android-project/app/build/outputs/apk/debug/app-debug.apk

